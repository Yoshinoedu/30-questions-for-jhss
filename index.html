<script>
const raw=[
['be動詞','私は生徒です。','I ___ a student.',['am','is','are','be'],'I に続く現在の be動詞は am。I am で「私は〜です」。','c00002'],
['be動詞','彼らは私の友達です。','They ___ my friends.',['are','is','am','be'],'They は複数を表すので are を使う。','c00002'],
['一般動詞','彼は毎日テニスをします。','He ___ tennis every day.',['plays','play','playing','to play'],'現在の習慣を表す文。主語が he なので、動詞 play に s をつける。','c00156'],
['疑問文・否定文','あなたは犬が好きですか。','___ you like dogs?',['Do','Are','Is','Does'],'like は一般動詞。主語が you の現在の疑問文は Do you + 動詞の原形。','c00157'],
['疑問文・否定文','彼女はコーヒーを飲みません。','She does not ___ coffee.',['drink','drinks','drinking','drank'],'does not の後ろは動詞の原形。三単現の s を重ねてつけない。','c00157'],
['代名詞','彼を知っています。','I know ___.',['him','he','his','himself'],'動詞 know の後ろは「〜を」にあたる目的格。he の目的格は him。','c00190'],
['名詞・冠詞','私はリンゴを１つ持っています。','I have ___ apple.',['an','a','many','two'],'apple は数えられる名詞。１つなら、母音の音で始まるので an をつける。','c00011'],
['名詞・冠詞','箱が２つあります。','I have two ___.',['boxes','box','boxs','a box'],'two の後ろは複数形。box は x で終わるため es をつける。','c00194'],
['進行形','彼女は今、本を読んでいます。','She is ___ a book now.',['reading','read','reads','to read'],'今まさにしていることは be動詞 + 動詞の ing形。','c00305'],
['過去形','私たちは昨日、公園に行きました。','We ___ to the park yesterday.',['went','go','goes','going'],'yesterday は過去の目印。go の過去形は went。','c00181'],
['過去形','彼らは昨日、忙しかった。','They ___ busy yesterday.',['were','was','are','is'],'They に続く be動詞の過去形は were。','c00010'],
['過去進行形','昨日の午後８時、私は勉強していました。','I ___ studying at eight last night.',['was','am','were','did'],'過去のある時点で進行中の動作は was / were + ing形。主語が I なので was。','c00009'],
['未来表現','明日、私は泳ぎに行くつもりです。','I am ___ to go swimming tomorrow.',['going','go','went','goes'],'be going to + 動詞の原形で予定を表す。am going to go で「行くつもり」。','c00272'],
['助動詞','彼は速く走ることができます。','He can ___ fast.',['run','runs','running','ran'],'can の後ろは主語に関係なく動詞の原形。','c00281'],
['助動詞','ここで泳いではいけません。','You ___ swim here.',['must not','do not have to','are not','not'],'「〜してはいけない」は must not + 動詞の原形。do not have to は「〜する必要はない」。','c00282'],
['命令文','ドアを開けてください。','Please ___ the door.',['open','opens','opening','opened'],'命令文は動詞の原形で始める。Please を添えると「〜してください」。','c00033'],
['There is / are','机の上に本が１冊あります。','There ___ a book on the desk.',['is','are','am','be'],'There is / are は「〜がある」。後ろが a book（単数）なので is。','c00020'],
['疑問詞','あなたは何冊、本を持っていますか。','___ many books do you have?',['How','What','Who','When'],'数えられるものの数を聞くときは How many + 複数形。','c00255'],
['接続詞','雨だったので家にいました。','I stayed home ___ it was rainy.',['because','but','or','if'],'理由を表す文をつなぐのは because。「雨だったので」という理由を後ろに置く。','c00248'],
['接続詞','明日雨なら、家にいます。','___ it rains tomorrow, I will stay home.',['If','Because','Although','So'],'「もし〜なら」は if。未来の条件でも if の中は現在形を使う。','c00247'],
['不定詞','私は英語を勉強したい。','I want ___ English.',['to study','studying','study','studied'],'want to + 動詞の原形で「〜したい」。','c00028'],
['不定詞','私はサッカーをするために公園に行きました。','I went to the park ___ soccer.',['to play','playing','played','plays'],'目的の「〜するために」は to + 動詞の原形で表せる。','c00295'],
['動名詞','私は音楽を聴くことを楽しみます。','I enjoy ___ to music.',['listening','to listen','listen','listened'],'enjoy の目的語に動詞を使うときは ing形。「〜すること」を表す。','c00028'],
['比較','この箱は、あの箱より大きい。','This box is ___ than that one.',['bigger','biggest','big','the biggest'],'than を使って２つを比べるときは比較級。big は g を重ねて bigger。','c00293'],
['比較','彼は私たちのクラスで最も背が高い生徒です。','He is the ___ student in our class.',['tallest','taller','tall','more tall'],'範囲の中で「最も〜」は最上級。tall の最上級は tallest。','c00290'],
['受け身','この部屋は毎日掃除されます。','This room is ___ every day.',['cleaned','clean','cleaning','cleans'],'「〜される」は be動詞 + 過去分詞。clean の過去分詞は cleaned。','c00284'],
['現在完了','私は３年間ここに住んでいます。','I have ___ here for three years.',['lived','live','living','lives'],'過去から今まで続く状態を表す現在完了。have + 過去分詞なので lived。','c00023'],
['現在完了','彼女は宿題を終えたところです。','She ___ just finished her homework.',['has','have','is','does'],'現在完了は have / has + 過去分詞。主語が She なので has。','c00023'],
['関係代名詞','あれは英語を教えている男性です。','That is the man ___ teaches English.',['who','which','what','where'],'人を後ろから説明し、その人が動作の主語になるときは who を使える。','c00013'],
['間接疑問文','あなたは彼がどこに住んでいるか知っていますか。','Do you know where ___?',['he lives','does he live','lives he','is he live'],'疑問の内容を文の一部に入れるときは「疑問詞 + 主語 + 動詞」の語順。','c00270']
];

r.vimeo.com/video/648404305?dnt=1&quality=540p"}, {"title": "must, have toの疑問文、否定文", "url": "https://www.eboard.jp/content/52/v/2/", "embed": "https://player.vimeo.com/video/648405584?dnt=1&quality=540p"}, {"title": "Don’t / Let’s / Please 〜.", "url": "https://www.eboard.jp/content/47/v/2/", "embed": "https://player.vimeo.com/video/648401575?dnt=1&quality=540p"}, {"title": "There is/are ～.", "url": "https://www.eboard.jp/content/154/v/1/", "embed": "https://player.vimeo.com/video/648405651?dnt=1&quality=540p"}, {"title": "How many ～?", "url": "https://www.eboard.jp/content/156/v/6/", "embed": "https://player.vimeo.com/video/648422228?dnt=1&quality=540p"}, {"title": "接続詞：because", "url": "https://www.eboard.jp/content/549/v/4/", "embed": "https://player.vimeo.com/video/648405401?dnt=1&quality=540p"}, {"title": "接続詞：if", "url": "https://www.eboard.jp/content/549/v/6/", "embed": "https://player.vimeo.com/video/648405446?dnt=1&quality=540p"}, {"title": "～すること：不定詞（名詞的用法）", "url": "https://www.eboard.jp/content/155/v/2/", "embed": "https://player.vimeo.com/video/648405755?dnt=1&quality=540p"}, {"title": "不定詞の副詞的用法", "url": "https://www.eboard.jp/content/53/v/5/", "embed": "https://player.vimeo.com/video/648405867?dnt=1&quality=540p"}, {"title": "動名詞と不定詞のちがい", "url": "https://www.eboard.jp/content/155/v/3/", "embed": "https://player.vimeo.com/video/648405721?dnt=1&quality=540p"}, {"title": "比較級：er のつけ方", "url": "https://www.eboard.jp/content/54/v/2/", "embed": "https://player.vimeo.com/video/648403200?dnt=1&quality=540p"}, {"title": "最上級", "url": "https://www.eboard.jp/content/54/v/3/", "embed": "https://player.vimeo.com/video/648403156?dnt=1&quality=540p"}, {"title": "受動態の文", "url": "https://www.eboard.jp/content/58/v/1/", "embed": "https://player.vimeo.com/video/648403295?dnt=1&quality=540p"}, {"title": "現在完了 継続", "url": "https://www.eboard.jp/content/60/v/3/", "embed": "https://player.vimeo.com/video/648404020?dnt=1&quality=540p"}, {"title": "現在完了 完了", "url": "https://www.eboard.jp/content/60/v/4/", "embed": "https://player.vimeo.com/video/648403961?dnt=1&quality=540p"}, {"title": "主格の関係代名詞", "url": "https://www.eboard.jp/content/62/v/2/", "embed": "https://player.vimeo.com/video/648404853?dnt=1&quality=540p"}, {"title": "間接疑問文①", "url": "https://www.eboard.jp/content/59/v/3/", "embed": "https://player.vimeo.com/video/648404327?dnt=1&quality=540p"}];
const Q=raw.map((r,i)=>({id:i,topic:r[0],jp:r[1],en:r[2],options:r[3],answer:r[3][0],why:r[4],video:VIDEOS[i],url:'https://www.benesse.jp/kyouiku/teikitest/chu/english/english/'+r[5]+'.html'}));
const key='grammar-step30-v1';let state={answers:{},reviewed:[],run:null},selected=null,filter='wrong';try{let v=JSON.parse(localStorage.getItem(key));if(v&&v.answers&&Array.isArray(v.reviewed)&&Object.keys(v.answers).every(k=>Q[k]&&(v.answers[k]===null||Q[k].options.includes(v.answers[k]))))state=v}catch{};
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let storageOk=true;function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{storageOk=false}}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function completed(){return Object.keys(state.answers).length===Q.length}function wrong(){return Q.filter(q=>q.id in state.answers&&state.answers[q.id]!==q.answer)}function unresolved(){return wrong().filter(q=>!state.reviewed.includes(q.id))}function goTop(){window.scrollTo({top:0,behavior:'smooth'})}function learn(q){return `<div class="video-resource" data-resource="${q.id}"><div class="small">動画で学び直そう</div><h3>${esc(q.video.title)}</h3><button class="primary video-link" type="button" data-video-open="${q.id}" aria-expanded="false" aria-controls="video-area-${q.id}">▶ 動画で学ぶ</button><div id="video-area-${q.id}" class="video-area" hidden><div class="video-frame" data-player-slot></div><div class="actions"><button class="secondary" type="button" data-video-close="${q.id}">動画を閉じる</button><button class="primary" type="button" data-practice="${q.id}">動画を見たので解き直す →</button></div><p class="notice">この画面で再生できます。プレーヤーの ▶ を押してね。音量・速度・全画面はプレーヤー内で変更できます。</p><details class="playback-help"><summary>再生できない場合</summary><p class="notice">通信環境や学校のフィルタリングで再生できないことがあります。インターネット接続を確認してください。</p><a class="video-index" href="${q.video.url}" target="_blank" rel="noopener noreferrer">提供元の視聴ページを開く ↗</a></details></div><div class="inline-practice" data-practice-slot hidden></div><p class="notice">授業動画：NPO法人eboard（イーボード）。動画を開いたときに公式プレーヤーを読み込みます。</p></div><a class="learn" href="${q.url}" target="_blank" rel="noopener noreferrer">文章で解説を読む ↗ <span class="small">ベネッセ公式</span></a>`}
function closeInlineVideo(resource){resource.querySelector('[data-player-slot]').replaceChildren();resource.querySelector('.video-area').hidden=true;let button=resource.querySelector('[data-video-open]');button.setAttribute('aria-expanded','false');button.textContent='▶ 動画で学ぶ';}
app.addEventListener('click',event=>{let button=event.target.closest('[data-video-open],[data-video-close],[data-practice],[data-practice-answer]');if(!button)return;let resource=button.closest('[data-resource]');if(!resource)return;let q=Q[Number(resource.dataset.resource)];if(button.hasAttribute('data-video-open')){let area=resource.querySelector('.video-area');if(!area.hidden){closeInlineVideo(resource);return}app.querySelectorAll('[data-resource]').forEach(other=>{if(other!==resource)closeInlineVideo(other)});let iframe=document.createElement('iframe');iframe.src=q.video.embed;iframe.title=q.video.title+' — eboardの授業動画';iframe.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';resource.querySelector('[data-player-slot]').replaceChildren(iframe);area.hidden=false;button.setAttribute('aria-expanded','true');button.textContent='動画を閉じる';}else if(button.hasAttribute('data-video-close')){closeInlineVideo(resource);resource.querySelector('[data-video-open]').focus();}else if(button.hasAttribute('data-practice')){closeInlineVideo(resource);let slot=resource.querySelector('[data-practice-slot]');slot.hidden=false;slot.innerHTML=`<h3>この問題を、もう一度</h3><p>${esc(q.jp)}</p><p class="sentence" lang="en">${esc(q.en)}</p><div class="options">${shuffle(q.options).map(o=>`<button class="option" type="button" data-practice-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div><p class="practice-result" role="status" aria-live="polite"></p>`;slot.scrollIntoView({behavior:'smooth',block:'nearest'});}else{let slot=resource.querySelector('[data-practice-slot]'),ok=button.dataset.practiceAnswer===q.answer;slot.querySelectorAll('[data-practice-answer]').forEach(b=>{b.disabled=true;if(b.dataset.practiceAnswer===q.answer)b.classList.add('correct');else if(b===button)b.classList.add('incorrect')});slot.querySelector('.practice-result').textContent=ok?'✓ 正解！ '+q.en.replace('___',q.answer)+'  — 復習クリア！':'もう一度、動画や解説で確認しよう。正解：'+q.answer+'。 '+q.why;if(ok&&q.id in state.answers&&state.answers[q.id]!==q.answer&&!state.reviewed.includes(q.id)){state.reviewed.push(q.id);save();let stats=app.querySelectorAll('.stats .card strong');if(stats.length===3){stats[1].textContent=wrong().length-unresolved().length;stats[2].textContent=unresolved().length;}}let again=document.createElement('button');again.className='secondary';again.type='button';again.dataset.practice=String(q.id);again.textContent=ok?'もう一度練習する':'もう一度解き直す';slot.append(again);}});

function home(){selected=null;let count=Object.keys(state.answers).length;app.innerHTML=`<section class="hero"><div><span class="tag">中学英文法の学び直し</span><h1>苦手がわかる。<br>そこから、できる。</h1><p class="muted">まずは30問で、今の自分をチェック。<br>つまずいた文法は、動画や解説で学んで<br>もう一度チャレンジしよう。</p><div class="actions"><button class="primary" id="start">${completed()?'診断結果を見る':count?'続きから解く →':'30問の診断をはじめる →'}</button>${count?'<button class="secondary" id="reset">記録をリセット</button>':''}</div><p class="notice">4択・全30問 ／ 目安10〜15分 ／ 時間制限なし${count?`<br>${count} / 30問 回答済み`:''}</p></div><div class="art" aria-hidden="true"><div class="art-inner"><div class="small">SMALL STEPS, REAL PROGRESS.</div><div class="art-line">I <b style="color:var(--green)">am</b> a student. <span class="check">✓</span></div><div class="art-line">She <b style="color:var(--green)">plays</b> tennis. <span class="check">✓</span></div><div class="art-line" style="border:0">ひとつずつ、わかればいい。</div></div><div class="bubble">まちがいは、伸びしろ。</div></div></section><div class="steps"><div class="step"><div class="num">01 / CHECK</div><h3>30問でチェック</h3><p>be動詞から関係代名詞まで。<br>わからない問題はスキップもOK。</p></div><div class="step"><div class="num">02 / LEARN</div><h3>つまずいたら、学ぶ</h3><p>短い授業動画と文章の解説で、<br>自分に合う方法で学び直そう。</p></div><div class="step"><div class="num">03 / RETRY</div><h3>苦手だけ、もう一度</h3><p>間違い・スキップをまとめて復習。<br>できた問題を少しずつ増やそう。</p></div></div><h3>今回チェックする文法</h3><div class="topics">${[...new Set(Q.map(q=>q.topic))].map(t=>`<span class="topic">${t}</span>`).join('')}</div>`;document.getElementById('start').onclick=()=>completed()?results():start('diagnostic');if(count)document.getElementById('reset').onclick=()=>document.getElementById('confirm').showModal()}
function start(mode){let ids=mode==='diagnostic'?Q.filter(q=>!(q.id in state.answers)).map(q=>q.id):unresolved().map(q=>q.id);if(!ids.length){results();return}state.run={mode,ids,index:0,answers:{},orders:Object.fromEntries(ids.map(id=>[id,shuffle(Q[id].options)]))};save();selected=null;quiz();goTop()}
function quiz(){let r=state.run;if(!r||r.index>=r.ids.length){state.run=null;save();results();return}const q=Q[r.ids[r.index]],answered=q.id in r.answers,value=r.answers[q.id],correct=value===q.answer;selected=null;app.innerHTML=`<div class="quiz-layout"><aside class="sidebar"><div class="small">${r.mode==='diagnostic'?'GRAMMAR CHECK':'RETRY SESSION'}</div><h2>${r.mode==='diagnostic'?'30問の診断':'苦手を復習'}</h2><p class="muted">焦らず、自分のペースで。<br>正解は回答後に確認できます。</p><div class="map">${r.ids.map((id,i)=>`<span class="dot ${i===r.index?'current':''} ${id in r.answers?(r.answers[id]===Q[id].answer?'done':'wrong'):''}" style="text-align:center">${id+1}</span>`).join('')}</div><p class="muted">緑：正解 ／ オレンジ：要復習</p></aside><section><div class="q-top"><span class="small">${r.mode==='diagnostic'?'診断':'解き直し'} ${r.index+1} / ${r.ids.length}</span><span class="tag">${q.topic}</span></div><div class="progress"><div style="width:${r.index/r.ids.length*100}%"></div></div><div class="card"><div class="small">空欄に入る最も適切なものを選ぼう</div><p>${q.jp}</p><div class="sentence" lang="en">${esc(q.en).replace('___','<span class="blank">?</span>')}</div><div class="options">${r.orders[q.id].map((o,i)=>`<button class="option ${answered?(o===q.answer?'correct':o===value?'incorrect':''):''}" data-option="${i}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="feedback ${correct?'':'wrong'}" role="status"><h3>${correct?'✓ 正解！':value===null?'ここから覚えよう':'もう一歩。ここを確認！'}</h3><p lang="en"><strong>${esc(q.en.replace('___',q.answer))}</strong></p><p>${esc(q.why)}</p>${correct?'':learn(q)}</div>`:''}<div class="bottom">${answered?`<span class="notice">${r.mode==='retry'&&correct?'復習クリア！':correct?'その調子！':'まちがえても大丈夫。結果画面から復習できます。'}</span><button class="primary" id="next">${r.index===r.ids.length-1?'結果を見る':'次の問題へ →'}</button>`:`<button class="text-btn" id="skip">わからない・あとで復習</button><button class="primary" id="answer" disabled>回答する</button>`}</div></div><p class="notice">${storageOk?'途中で閉じても、このブラウザーで再開できます。':'ブラウザーの保存機能が使えないため、画面を閉じると記録が失われます。'}</p></section></div>`;if(!answered){app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{selected=r.orders[q.id][+b.dataset.option];app.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('answer').disabled=false});document.getElementById('answer').onclick=()=>submit(selected);document.getElementById('skip').onclick=()=>submit(null)}else document.getElementById('next').onclick=()=>{r.index++;save();quiz();goTop()}}
function submit(value){let r=state.run,q=Q[r.ids[r.index]];if(q.id in r.answers)return;r.answers[q.id]=value;if(r.mode==='diagnostic')state.answers[q.id]=value;else if(value===q.answer&&!state.reviewed.includes(q.id))state.reviewed.push(q.id);save();quiz()}
function resume(){if(state.run){quiz();goTop()}else start('diagnostic')}
function results(){let w=wrong(),score=Q.length-w.length,remaining=unresolved();if(!completed()){home();return}app.innerHTML=`<div class="small">YOUR LEARNING REPORT</div><h2>できたところも、次の一歩も。</h2><p class="muted">診断おつかれさま。間違いは、これから伸ばせるポイントです。</p><div class="card score-head"><div class="score">${score}<small> / 30</small></div><div><strong>最初の診断の正解数</strong><p class="notice">${w.length===0?'全問正解！基本がしっかり身についています。':remaining.length===0?'苦手な問題をすべて復習できました！':`あと ${remaining.length} 問。動画で学んで、できるを増やそう。`}</p></div></div><div class="stats"><div class="card"><strong>${w.length}</strong>診断の間違い・スキップ</div><div class="card"><strong>${w.length-remaining.length}</strong>解き直しでクリア</div><div class="card"><strong>${remaining.length}</strong>これから復習</div></div><div class="actions">${remaining.length?'<button class="primary" id="retry">苦手な問題だけ解き直す →</button>':''}<button class="secondary" id="reset">新しく診断する</button><button class="secondary" id="download">学習結果を保存</button></div><div class="filters"><button data-filter="wrong" class="${filter==='wrong'?'active':''}">間違い・スキップ (${w.length})</button><button data-filter="all" class="${filter==='all'?'active':''}">全30問</button></div><div id="review">${(filter==='all'?Q:w).map(q=>{let ok=state.answers[q.id]===q.answer,mastered=state.reviewed.includes(q.id);return `<details class="card review-item"><summary><span class="tag">${ok?'✓ 正解':mastered?'✓ 復習クリア':'要復習'}</span> Q${q.id+1}　${q.topic}<br><span lang="en">${esc(q.en)}</span></summary><p>${q.jp}</p><p>診断の回答：<strong>${state.answers[q.id]===null?'わからない・スキップ':esc(state.answers[q.id])}</strong></p><p>正解：<strong lang="en">${esc(q.en.replace('___',q.answer))}</strong></p><p>${esc(q.why)}</p>${learn(q)}</details>`}).join('')||'<div class="card">間違えた問題はありません。全30問から解説を見返せます。</div>'}</div>`;if(remaining.length)document.getElementById('retry').onclick=()=>start('retry');document.getElementById('reset').onclick=()=>document.getElementById('confirm').showModal();app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;results()});document.getElementById('download').onclick=()=>{let text=['英文法 STEP 30 学習結果',new Date().toLocaleDateString('ja-JP'),`診断正解 ${score}/30・復習クリア ${w.length-remaining.length}/${w.length}`,...Q.map(q=>`Q${q.id+1} ${q.topic}：${state.answers[q.id]===q.answer?'正解':state.reviewed.includes(q.id)?'復習クリア':'要復習'}\n${q.en.replace('___',q.answer)}\n${q.why}\n${q.url}\n動画：${q.video.title}\n${q.video.url}`)].join('\n\n');let url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='grammar-step30-results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.getElementById('homeBtn').onclick=()=>{home();if(state.run){let b=document.getElementById('start');b.textContent='学習を再開する →';b.onclick=resume}goTop()};document.getElementById('cancelReset').onclick=()=>document.getElementById('confirm').close();document.getElementById('doReset').onclick=()=>{state={answers:{},reviewed:[],run:null};save();document.getElementById('confirm').close();start('diagnostic')};if(state.run)quiz();else home();
</script></body></html>
